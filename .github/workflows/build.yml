name: Build Haxe Project

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Cache Haxe Libs
        id: cache-haxe-libs
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/haxe/lib/
          key: ${{ runner.os }}-haxe-libs-lime8.3.2-openfl9.5.2-flixel6.2.0-addons4.0.2

      - name: Setup Haxe Libs
        run: |
          haxelib install lime 8.3.2 --quiet --always
          haxelib install openfl 9.5.2 --quiet --always
          haxelib install flixel 6.2.0 --quiet --always
          haxelib install flixel-addons 4.0.2 --quiet --always

      - name: Build project
        run: haxelib run lime build html5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: export/html5/bin

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
